<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Drive</title>
<script src="https://cdn.jsdelivr.net/gh/zaka13alt/eaglercraft-launcher@main/script.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background-color: #121212; color: #fff; height: 100vh; width: 100vw; overflow: hidden; display: flex; position: relative; }
#launcher-container { display: flex; width: 100%; height: 100%; transition: opacity 0.2s ease; }
.sidebar { width: 250px; background-color: #1a1a1a; border-right: 1px solid #330000; display: flex; flex-direction: column; padding: 20px 0; z-index: 10; }
.sidebar h2 { color: #e0e0e0; text-align: center; margin-bottom: 20px; }
.sidebar-btn { background: none; border: none; color: #b0b0b0; padding: 15px 20px; text-align: left; font-size: 16px; cursor: pointer; transition: all 0.3s ease; }
.sidebar-btn:hover { background-color: #2a0000; color: #ff4d4d; }
.sidebar-btn.active { background-color: #330000; color: #ff4d4d; border-left: 4px solid #ff4d4d; }
.content { flex-grow: 1; padding: 40px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; background-color: #121212; position: relative; overflow-y: auto; }
.panel { display: none; flex-direction: column; align-items: center; text-align: center; width: 100%; }
.panel.active { display: flex; }
select, button { padding: 12px 20px; margin: 15px 0; border-radius: 5px; border: 1px solid #550000; font-size: 16px; }
select { background-color: #220000; color: #fff; width: 300px; cursor: pointer; }
button { background-color: #cc0000; color: white; border: none; cursor: pointer; font-weight: bold; width: 300px; transition: background 0.2s; }
button:hover { background-color: #ff0000; }
.server-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; margin-top: 20px; padding: 20px; }
.server-card { background: #1a1a1a; border: 1px solid #330000; border-radius: 8px; padding: 15px; text-align: center; transition: transform 0.2s; }
.server-card:hover { transform: translateY(-5px); border-color: #ff4d4d; }
.server-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; margin-bottom: 15px; }
.server-card h3 { color: #ff4d4d; margin-bottom: 10px; }
.server-card p { color: #b0b0b0; font-size: 14px; margin-bottom: 15px; }
.ip-box { background: #0a0a0a; padding: 10px; border: 1px solid #550000; border-radius: 5px; font-family: monospace; color: #00ffcc; word-break: break-all; user-select: all; }

/* RECONSTRUCTED GAME HOLDER */
#game-iframe-container { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100; background: #000; }
iframe { width: 100%; height: 100%; border: none; }
.back-btn { position: absolute; top: 10px; left: 10px; z-index: 101; width: auto; padding: 8px 15px; background: rgba(0,0,0,0.8); border: 1px solid #ff4d4d; color: #ff4d4d; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<div id="launcher-container">
    <div class="sidebar">
        <h2>Navigation</h2>
        <button class="sidebar-btn active" onclick="switchPanel('home-panel')">Home</button>
        <button class="sidebar-btn" onclick="switchPanel('servers-panel')">Servers</button>
    </div>
    <div class="content">
        <div class="panel active" id="home-panel">
            <h1 style="color: #ff4d4d; margin-bottom: 20px;">Eaglercraft Launcher</h1>
            <select id="version-dropdown">
                <option value="1.21.11new">Minecraft 1.21.11</option>
<option value="1.12.2">Minecraft 1.12.2</option>
<option value="1.5.2">Minecraft 1.5.2</option>
<option value="1.12forge">Minecraft 1.12.2 (+ EaglerForge)</option>
<option value="1.2.5">Minecraft 1.2.5</option>
<option value="b1.8.1">Beta 1.8.1</option>
<option value="1.16.5">Minecraft 1.16.5 (new!)</option>
<option value="b1.7.3">Beta 1.7.3</option>

            </select>
            <button onclick="playGame()">PLAY</button>
        </div>

        <div class="panel" id="servers-panel">
            <h1>Multiplayer Servers</h1>
            <p style="color: #b0b0b0;">Click an IP to copy and paste it into your game!</p>
            <div class="server-list">
                <div class="server-card">
                    <img src="https://dssx.uk/favicon.ico" alt="DSSX">
                    <h3>DSSX</h3>
                    <p>The best server for peaceful survival!</p>
                    <div class="ip-box">wss://mc.dssx.uk</div>
                </div>
                <div class="server-card">
                    <img src="https://imgur.com" alt="ArchMC">
                    <h3>ArchMC</h3>
                    <p>Survival, Factions, and custom minigames.</p>
                    <div class="ip-box">wss://arch.mc</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="game-iframe-container">
    <button class="back-btn" onclick="closeGame()">← Leave Game</button>
    
    <iframe id="game-frame" allow="autoplay; gamepad; microphone; pointer-lock" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock"></iframe>
</div>


</body>
</html>
